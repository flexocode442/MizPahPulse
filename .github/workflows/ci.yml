name: MizpahPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test'

jobs:
  # ──────────────────────────────────────
  # Lint & Typecheck
  # ──────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

  # ──────────────────────────────────────
  # Test
  # ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Run tests
        run: npx turbo run test

      - name: Enforce web coverage thresholds
        # Coverage thresholds are defined in apps/web/vitest.config.ts and
        # scoped to src/lib/** (the unit-tested logic layer). Fails the build
        # when coverage drops below the configured floor.
        run: npx vitest run --coverage
        working-directory: apps/web

  # ──────────────────────────────────────
  # Build
  # ──────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Build all apps
        run: npx turbo run build

  # ──────────────────────────────────────
  # Smart Contract Build & Test
  # ──────────────────────────────────────
  contract:
    name: Smart Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run contract tests
        run: cd contracts && cargo test

      - name: Build contract WASM
        run: cd contracts && cargo build --target wasm32-unknown-unknown --release

      - name: Verify WASM artifact
        run: |
          WASM_PATH="contracts/target/wasm32-unknown-unknown/release/pulse_contract.wasm"
          if [ -f "$WASM_PATH" ]; then
            echo "✅ WASM built: $(du -h "$WASM_PATH" | cut -f1)"
          else
            echo "❌ WASM not found at $WASM_PATH"
            exit 1
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/pulse_contract.wasm
          retention-days: 30

  # ──────────────────────────────────────
  # Contract WASM Reproducibility (main only, issue #79)
  # ──────────────────────────────────────
  contract-reproducibility:
    name: Contract WASM Reproducibility
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Verify WASM reproducibility
        # Builds the contract twice into isolated target dirs and compares
        # sha256 hashes of the resulting WASM artifacts.
        run: bash scripts/verify-wasm-reproducibility.sh

  # ──────────────────────────────────────
  # Contract Deployment (manual trigger on main)
  # Requires GitHub Secrets: DEPLOYER_SECRET
  # ──────────────────────────────────────
  deploy-contract:
    name: Deploy Contract
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [contract, lint-and-typecheck, test]
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: pulse-contract-wasm
          path: contracts/target/wasm32-unknown-unknown/release/

      - name: Deploy contract to Stellar Testnet
        run: npx tsx scripts/deploy-contract.ts
        env:
          DEPLOYER_SECRET: ${{ secrets.DEPLOYER_SECRET }}

  # ──────────────────────────────────────
  # Docker Build (main only)
  # ──────────────────────────────────────
  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build
